name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch: # 允許手動從 GitHub 網頁觸發打包

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Restore Stable Debug Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Error: ANDROID_KEYSTORE_BASE64 secret is not set!"
            exit 1
          fi
          # Filter out any potential whitespace or markers to be extra safe
          CLEAN_BASE64=$(echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | sed 's/====BASE64_START====//g' | sed 's/====BASE64_END====//g')
          echo "$CLEAN_BASE64" | base64 --decode > ~/.android/debug.keystore



      - name: Create Environment Variables
        run: |
          echo "VITE_API_URL=https://taskreminder-api.onrender.com/api" > frontend/.env
        
      - name: Install Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Web Assets (Vite)
        working-directory: ./frontend
        run: npm run build

      - name: Sync Capacitor to Android
        working-directory: ./frontend
        run: npx cap sync android

      - name: Build Android APK
        working-directory: ./frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskFlow-Android-App
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk

